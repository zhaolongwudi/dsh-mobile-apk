# daily-sync.yml — 每天北京时间 04:00 同步上游 kelai141/dsh-mobile-apk 的新提交
#
# 只做「拉取 + 重打 fork 补丁 + 推送」，不负责构建：
#   构建由 build-apk.yml 自己的 schedule（UTC 20:30 / 北京 04:30）承担，产物由 nightly-publish.yml 发布。
#   拆开的原因：构建要读默认分支最新代码，而同一 workflow 里的 job 用的是触发时的旧提交。
#
# 推送判据（2026-11-12 修）：比「本地 HEAD」与「远端 main」。不要用 git diff --cached ——
#   git merge 成功时 merge 提交已经写完，暂存区与 HEAD 必然一致，那个判据恒为「无变化」，
#   会让脚本在合并成功后 exit 0、跳过 push，runner 一销毁这次同步就消失了（旧脚本的缺陷）。
#
# 合并策略：git merge -X theirs。fork 只改 README 与 build-apk.yml 两处，
#   冲突时一律取上游版本，再交给 inject-fork-patches.mjs 重新打补丁，保证代码永远是上游最新。
name: daily-sync

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出 fork 默认分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          # 推 .github/workflows/** 需要 `workflows` 权限，而 GITHUB_TOKEN 是 GitHub App
          # 令牌、拿不到这个权限 —— 2026-11-12 上游那批改了 pr-gate.yml，push 被 GitHub
          # 拒了（refusing to allow a GitHub App to create or update workflow ...）。
          # 配了仓库 secret SYNC_TOKEN（PAT：Contents 读写 + Workflows 读写）就用它；
          # 没配则回落到 github.token，行为与现在一致（批里不含工作流改动时照常能推）。
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: 合并上游 main 并刷新 fork 补丁
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kelai141/dsh-mobile-apk.git 2>/dev/null || true
          git fetch --no-tags upstream main
          UP=$(git rev-parse upstream/main)
          echo "上游 main: $UP"

          # ── 移植件安全边界（合并前记账）────────────────────────────────
          # port/ 是 fork 独有内容（上游没有这个目录），只可能被「这次合并」或
          # 「补丁脚本」误伤。取它整棵子树的 tree 哈希：覆盖、替换、改名、删除、
          # 内容改写，任一发生哈希都会变 —— 合并后再比一次，变了就判红、不推。
          PORT_BEFORE=$(git rev-parse --verify -q "HEAD:port" || echo '')
          if [ -n "$PORT_BEFORE" ]; then
            echo "port 树哈希（合并前）: ${PORT_BEFORE:0:12}"
          else
            echo "::warning::HEAD 下没有 port/ 目录，本次跳过移植件不变性判据"
          fi

          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "上游无新提交，只刷新补丁"
          else
            echo "检测到上游新提交，开始合并"
            if ! git merge --no-edit -X theirs "$UP"; then
              git merge --abort || true
              echo "::error::合并上游失败（非文件冲突类错误），请人工处理"
              exit 1
            fi
            echo "合并完成：上游 ${UP:0:8} 已进入本地历史"
          fi

          node .github/scripts/inject-fork-patches.mjs

          # 这里的暂存区判据只负责「补丁刷新是否需要补一个提交」，
          # 不再兼职判断「要不要推送」—— 合并本身已由 git 写成 merge 提交。
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: 刷新 fork 补丁（上游 ${UP:0:8}）"
          fi

          # ── 移植件安全边界（合并后核对）────────────────────────────────
          # 只在 port/ 的 tree 哈希与合并前逐字节一致时才允许推送：
          # 被上游覆盖、被别的文件取替、改名或删除，都会在这里判红。
          if [ -n "$PORT_BEFORE" ]; then
            PORT_AFTER=$(git rev-parse --verify -q "HEAD:port" || echo '')
            if [ "$PORT_AFTER" != "$PORT_BEFORE" ]; then
              echo "::error::这次同步动了 port/（${PORT_BEFORE:0:12} -> ${PORT_AFTER:0:12}）—— 移植件被覆盖/替换/删除，已中止推送，请人工核对"
              git diff --stat "$PORT_BEFORE" "$PORT_AFTER" || true
              exit 1
            fi
            echo "port 树哈希未变：${PORT_AFTER:0:12}（移植件逐字节原样，未被上游取替）"
          fi

          # 推送判据：比「本地 HEAD」与「远端 main 的实际位置」。
          # 绝不能用 git diff --cached：git merge 成功时 merge 提交已经写完，暂存区与 HEAD
          # 必然一致，那个判据恒为「无变化」→ 直接 exit 0，把整个 merge 连同这次 push 一起
          # 吞掉。2026-11-12 的 run#3 就是这么报着 success、而 fork main 一直落后上游
          # 54 个提交的根因（runner 一销毁，本地 merge 提交就没了）。
          # 取不到远端点时按「需要推送」处理：无事可推时 git 自己会报 up-to-date，不会出错，
          # 而「探测失败就跳过」又会变回这次要修的静默丢同步。
          REMOTE=$(git fetch --no-tags origin main >/dev/null 2>&1 && git rev-parse FETCH_HEAD || echo '')
          if [ -n "$REMOTE" ] && [ "$(git rev-parse HEAD)" = "$REMOTE" ]; then
            echo "本地 HEAD 与远端 main 一致（$(git rev-parse --short HEAD)），无需推送"
            exit 0
          fi

          # push 失败要说清是哪一种失败：工作流文件被拒 ≠ 网络/权限泛泛而谈。
          if ! PUSH_OUT=$(git push origin HEAD:main 2>&1); then
            echo "$PUSH_OUT"
            case "$PUSH_OUT" in
              *'without `workflows` permission'*)
                # ── 降级：GITHUB_TOKEN 推不了 .github/workflows/** ──────────────
                # 2026-11-13 实测：只要批次里带了 pr-gate.yml 这类工作流改动，整个 push
                # 被拒，上游代码/docs/移植件一份都进不来，job 只留一行 remote rejected。
                # 代码与工作流本是两类东西，这里把它们分开：先把「工作流之外」的全部
                # 改动推上去，工作流文件留给 SYNC_TOKEN 或手工同步补。
                echo "::warning::批次含工作流改动且无 workflows 权限，降级为只推非工作流部分"
                # 从 HEAD 拉临时分支，把 .github/workflows 恢复成远端版本
                git checkout -q -B _sync_noworkflows
                git checkout -q FETCH_HEAD -- .github/workflows
                if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
                  git commit -q -m "chore: 同步上游（工作流改动因缺 workflows 权限暂缓）"
                fi
                if git push origin HEAD:main 2>&1 | tail -3; then
                  echo "✔ 非工作流部分已推送（上游代码/文档/移植件已到位）"
                else
                  echo "::error::非工作流部分推送也失败，看上方 git 输出"
                  exit 1
                fi
                echo "::error::工作流改动（.github/workflows/**）未推送：配 SYNC_TOKEN（PAT，Workflows 读写），或跑 .github/scripts/sync-upstream-now.sh 手工补。"
                exit 1
                ;;
              *)
                echo "::error::push 失败，看上方 git 输出定位"
                ;;
            esac
            exit 1
          fi
          echo "$PUSH_OUT"
          echo "已推送到 main：${REMOTE:0:8} -> $(git rev-parse --short HEAD)"
